<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyVoice — 로그인</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#7c6dfa">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800;900&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090f; --bg2: #0d1020;
      --surface: rgba(255,255,255,0.04); --surface2: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.09); --border2: rgba(124,109,250,0.35);
      --text: #eef0f8; --muted: #7a8299; --muted2: #4a5270;
      --accent: #7c6dfa; --accent2: #4fd1c5; --accent3: #f687b3;
      --danger: #f05252; --success: #34d399;
      --grad: linear-gradient(135deg, #7c6dfa 0%, #4fd1c5 100%);
      --font-h: 'Syne', sans-serif; --font-b: 'Noto Sans KR', sans-serif;
      --radius: 16px; --radius-sm: 10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-b); background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 600px 400px at 10% 20%, rgba(124,109,250,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 500px 400px at 90% 80%, rgba(79,209,197,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 400px 300px at 50% 50%, rgba(246,135,179,0.05) 0%, transparent 60%);
      animation: bgShift 15s ease-in-out infinite alternate;
    }
    @keyframes bgShift { 0%{opacity:1;transform:scale(1)} 100%{opacity:0.8;transform:scale(1.05)} }

    .login-card {
      position: relative; z-index: 1;
      background: rgba(13,16,32,0.8); backdrop-filter: blur(24px);
      border: 1px solid var(--border2); border-radius: var(--radius);
      padding: 2.5rem 2rem; width: 100%; max-width: 420px; margin: 1rem;
      box-shadow: 0 0 60px rgba(124,109,250,0.15);
    }

    .logo-area {
      text-align: center; margin-bottom: 2rem;
    }
    .logo-area img { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 0.6rem; }
    .logo-area h1 {
      font-family: var(--font-h); font-size: 1.5rem; font-weight: 900;
      background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .logo-area p { font-size: 0.78rem; color: var(--muted); margin-top: 0.3rem; }

    .tabs {
      display: flex; gap: 0; margin-bottom: 1.5rem;
      border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden;
    }
    .tab {
      flex: 1; padding: 0.6rem; text-align: center; cursor: pointer;
      font-size: 0.85rem; font-weight: 600; color: var(--muted);
      background: transparent; border: none; transition: all 0.2s;
      font-family: var(--font-b);
    }
    .tab.active { background: var(--accent); color: #fff; }
    .tab:hover:not(.active) { color: var(--text); background: var(--surface2); }

    .form-group { margin-bottom: 0.8rem; }
    .form-group label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 0.3rem; font-weight: 500; }
    .form-group input {
      width: 100%; padding: 0.65rem 0.8rem; font-size: 0.85rem;
      background: rgba(0,0,0,0.3); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text); outline: none;
      font-family: var(--font-b); transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,109,250,0.15); }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      width: 100%; padding: 0.7rem; border: none; border-radius: var(--radius-sm);
      font-family: var(--font-b); font-size: 0.88rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary { background: var(--grad); color: #fff; box-shadow: 0 0 20px rgba(124,109,250,0.3); }
    .btn-primary:hover:not(:disabled) { box-shadow: 0 0 35px rgba(124,109,250,0.5); }

    .btn-google {
      background: #fff; color: #333; margin-top: 0.6rem;
      border: 1px solid #ddd; font-weight: 500;
    }
    .btn-google:hover { background: #f5f5f5; }
    .btn-google svg { width: 18px; height: 18px; }

    .divider {
      display: flex; align-items: center; gap: 0.8rem; margin: 1rem 0;
      color: var(--muted2); font-size: 0.75rem;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .form-panel { display: none; }
    .form-panel.active { display: block; }

    .msg {
      padding: 0.6rem 0.8rem; border-radius: var(--radius-sm);
      font-size: 0.78rem; margin-bottom: 0.8rem; display: none;
    }
    .msg.error { display: block; background: rgba(240,82,82,0.12); border: 1px solid rgba(240,82,82,0.3); color: #fca5a5; }
    .msg.success { display: block; background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.3); color: var(--success); }

    .spin {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .resend-link {
      display: none; font-size: 0.75rem; color: var(--accent); cursor: pointer;
      text-decoration: underline; margin-top: 0.3rem;
    }
    .resend-link:hover { color: var(--accent2); }

    @media (max-width: 480px) {
      .login-card { padding: 1.5rem 1.2rem; margin: 0.5rem; }
      .logo-area h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="logo-area">
    <img src="/icons/icon-192x192.png" alt="MyVoice">
    <h1>MyVoice</h1>
    <p>AI 목소리 복제 TTS 스튜디오</p>
  </div>

  <div id="msgBox" class="msg"></div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">로그인</button>
    <button class="tab" onclick="switchTab('register')">회원가입</button>
  </div>

  <!-- 로그인 폼 -->
  <div class="form-panel active" id="loginPanel">
    <form onsubmit="doLogin(event)">
      <div class="form-group">
        <label>이메일</label>
        <input type="email" id="loginEmail" placeholder="example@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="loginPassword" placeholder="8자 이상" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">로그인</button>
    </form>
    <div class="divider">또는</div>
    <button class="btn btn-google" onclick="googleLogin()">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google 계정으로 로그인
    </button>
  </div>

  <!-- 회원가입 폼 -->
  <div class="form-panel" id="registerPanel">
    <form onsubmit="doRegister(event)">
      <div class="form-group">
        <label>이름</label>
        <input type="text" id="regName" placeholder="표시될 이름" required>
      </div>
      <div class="form-group">
        <label>이메일</label>
        <input type="email" id="regEmail" placeholder="example@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="regPassword" placeholder="8자 이상" required minlength="8" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>비밀번호 확인</label>
        <input type="password" id="regPasswordConfirm" placeholder="비밀번호 재입력" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" id="regBtn">회원가입</button>
    </form>
    <span class="resend-link" id="resendLink" onclick="resendVerification()">인증 이메일 재발송</span>
    <div class="divider">또는</div>
    <button class="btn btn-google" onclick="googleLogin()">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google 계정으로 가입
    </button>
  </div>
</div>

<script>
  // URL 파라미터 체크
  const params = new URLSearchParams(location.search);
  if (params.get('verified') === 'true') {
    showMsg('이메일 인증이 완료되었습니다! 로그인해주세요.', 'success');
  }
  if (params.get('error') === 'invalid_token') {
    showMsg('인증 링크가 만료되었거나 유효하지 않습니다.', 'error');
  }
  if (params.get('error') === 'google_failed') {
    showMsg('Google 로그인에 실패했습니다.', 'error');
  }

  // 이미 로그인 상태면 메인으로
  fetch('/api/auth/me', { credentials: 'include' }).then(r => {
    if (r.ok) location.href = '/';
  }).catch(() => {});

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', (tab === 'login' ? i === 0 : i === 1));
    });
    document.getElementById('loginPanel').classList.toggle('active', tab === 'login');
    document.getElementById('registerPanel').classList.toggle('active', tab === 'register');
    hideMsg();
  }

  function showMsg(text, type) {
    const box = document.getElementById('msgBox');
    box.textContent = text;
    box.className = 'msg ' + type;
  }
  function hideMsg() {
    document.getElementById('msgBox').className = 'msg';
  }

  async function doLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    hideMsg();

    const fd = new FormData();
    fd.append('email', document.getElementById('loginEmail').value);
    fd.append('password', document.getElementById('loginPassword').value);

    try {
      const res = await fetch('/api/auth/login', { method: 'POST', body: fd, credentials: 'include' });
      const d = await res.json();
      if (res.ok) {
        localStorage.setItem('access_token', d.access_token);
        location.href = '/';
      } else {
        showMsg(d.detail || '로그인 실패', 'error');
      }
    } catch(e) {
      showMsg('서버 연결 실패', 'error');
    }
    btn.disabled = false; btn.textContent = '로그인';
  }

  let lastRegEmail = '';
  async function doRegister(e) {
    e.preventDefault();
    const pw = document.getElementById('regPassword').value;
    const pwc = document.getElementById('regPasswordConfirm').value;
    if (pw !== pwc) return showMsg('비밀번호가 일치하지 않습니다', 'error');

    const btn = document.getElementById('regBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    hideMsg();

    const fd = new FormData();
    fd.append('email', document.getElementById('regEmail').value);
    fd.append('password', pw);
    fd.append('display_name', document.getElementById('regName').value);
    lastRegEmail = document.getElementById('regEmail').value;

    try {
      const res = await fetch('/api/auth/register', { method: 'POST', body: fd });
      const d = await res.json();
      if (res.ok) {
        showMsg(d.message || '가입 완료! 이메일을 확인해주세요.', 'success');
        document.getElementById('resendLink').style.display = 'inline';
      } else {
        showMsg(d.detail || '가입 실패', 'error');
      }
    } catch(e) {
      showMsg('서버 연결 실패', 'error');
    }
    btn.disabled = false; btn.textContent = '회원가입';
  }

  async function resendVerification() {
    if (!lastRegEmail) return;
    const fd = new FormData();
    fd.append('email', lastRegEmail);
    const res = await fetch('/api/auth/resend-verification', { method: 'POST', body: fd });
    const d = await res.json();
    showMsg(d.message || '재발송 완료', 'success');
  }

  function googleLogin() {
    location.href = '/api/auth/google';
  }
</script>
</body>
</html>
