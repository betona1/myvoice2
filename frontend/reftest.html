<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>남성 음성 듣고 고르기</title>
<style>
:root{color-scheme:light dark}
body{margin:0;padding:18px;font-family:system-ui,"Noto Sans KR",sans-serif;
     background:#f7f7f8;color:#191919;max-width:760px;margin:0 auto}
h1{font-size:1.35rem;margin:.2em 0 .1em}
p.lead{color:#555;font-size:.95rem;margin:.2em 0 1.1em;line-height:1.55}
.leg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.leg span{padding:6px 12px;border-radius:999px;font-size:.85rem;font-weight:600}
.la{background:#e9e9ee;color:#444}.lb{background:#dbeafe;color:#1e40af}
.lc{background:#dcfce7;color:#166534}
.row{background:#fff;border:1px solid #e3e3e8;border-radius:12px;
     padding:12px 14px;margin-bottom:10px}
.zh{font-size:1.55rem;font-weight:600;margin-bottom:9px;line-height:1.3}
.zh.s{font-size:1.15rem;font-weight:500}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:10px 18px;font-size:1rem;font-weight:600;
       cursor:pointer;font-family:inherit}
.a{background:#e9e9ee;color:#444}.b{background:#dbeafe;color:#1e40af}
.c{background:#dcfce7;color:#166534}
button:active{transform:scale(.96)}
.playing{outline:3px solid #f59e0b;outline-offset:1px}
.tip{margin-top:22px;padding:14px;background:#fffbeb;border:1px solid #fde68a;
     border-radius:10px;font-size:.92rem;line-height:1.6;color:#78350f}
@media (prefers-color-scheme:dark){
 body{background:#17171a;color:#eee}.row{background:#222226;border-color:#33333a}
 p.lead{color:#aaa}.a,.la{background:#33333a;color:#ccc}
 .b,.lb{background:#1e3a5f;color:#bfdbfe}.c,.lc{background:#14532d;color:#bbf7d0}
 .tip{background:#2a2410;border-color:#57430f;color:#fde68a}}
</style></head><body>
<h1>남성 음성 세 가지 듣고 고르기</h1>
<p class="lead">같은 낱말을 기준 목소리만 바꿔 만들었습니다. 셋을 잇달아 들어 보시고
어느 쪽이 나은지 <b>가·나·다</b> 로 알려 주세요.</p>
<div class="leg"><span class="la">가 &middot; 지금 쓰는 목소리</span>
<span class="lb">나 &middot; 새 녹음 중 가장 깨끗한 한 토막</span>
<span class="lc">다 &middot; 새 녹음 다섯 개를 함께</span></div>
<div id="list"></div>
<div class="tip"><b>들으실 때</b><br>
① 소리가 또렷한가 &nbsp;② 성조가 제대로 오르내리는가 &nbsp;③ 끝이 잘리거나 군더더기가 붙지 않는가<br>
셋 다 마음에 안 드시면 그렇게 말씀해 주세요. 녹음을 다시 다듬거나 다른 구간으로 잡아 보겠습니다.</div>
<script>
const W=['材料','张','那些','很','一点儿','个','二','哪','妈妈','什么','会',
         '我们明天去图书馆看书。','这个问题有点儿难，但是我会努力。'];
const L={A:'가',B:'나',C:'다'};
let cur=null;
document.getElementById('list').innerHTML=W.map((t,i)=>{
  const n=String(i).padStart(2,'0');
  return `<div class="row"><div class="zh${t.length>4?' s':''}">${t}</div><div class="btns">`+
    ['A','B','C'].map(k=>`<button class="${k.toLowerCase()}" data-s="/outputs/chinese/_reftest/${n}${k}.wav">${L[k]}</button>`).join('')+
    `</div></div>`;
}).join('');
document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-s]'); if(!b) return;
  if(cur){cur.a.pause(); cur.b.classList.remove('playing');}
  const a=new Audio(b.dataset.s); b.classList.add('playing');
  a.onended=()=>b.classList.remove('playing');
  a.play(); cur={a,b};
});
</script></body></html>
