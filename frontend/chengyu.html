<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7c6dfa">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<title>4자성어 학습</title>
<style>
:root{
  --hz:1;
  --bg:#14141b; --bg2:#1b1b24; --surface:#23232e; --surface2:#2c2c38;
  --border:#33333f; --text:#eceff4; --muted:#a9adbb; --muted2:#6e7383;
  --accent:#7c6dfa; --accent2:#4fd1c5; --success:#34d399; --danger:#f05252; --warn:#f0a020;
  --gold:#e0b96a;
  --grad:linear-gradient(135deg,#7c6dfa,#4fd1c5);
  --grad-g:linear-gradient(135deg,#c9973f,#e8c98a);
  --font-cn:'Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','SimSun',
            'Noto Sans CJK SC','Heiti SC',sans-serif;
}
body.light{--bg:#f7f8fa;--bg2:#fff;--surface:#f0f1f5;--surface2:#e6e8ef;--border:#dcdfe8;
  --text:#1c1e26;--muted:#5b606e;--muted2:#8b90a0;--gold:#a97c28;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Malgun Gothic',sans-serif;
  padding-bottom:calc(env(safe-area-inset-bottom) + 1rem);}
a{color:var(--accent);text-decoration:none;}

.top{position:sticky;top:0;z-index:50;background:var(--bg2);border-bottom:1px solid var(--border);
  padding:0.6rem 0.8rem;display:flex;align-items:center;gap:0.5rem;}
.top h1{font-size:1.05rem;margin:0;flex:1;font-weight:800;}
.top h1 em{font-style:normal;font-family:var(--font-cn);color:var(--gold);margin-right:0.3rem;}
.tbtn{background:var(--surface);border:1px solid var(--border);color:var(--muted);
  border-radius:9px;padding:0.4rem 0.7rem;font-size:0.85rem;cursor:pointer;white-space:nowrap;}
.tbtn:hover{border-color:var(--accent);color:var(--accent);}
.wrap{max-width:820px;margin:0 auto;padding:0.8rem;}

/* 홈 */
.today{background:var(--bg2);border:1.5px solid var(--gold);border-radius:16px;
  padding:1rem;margin-bottom:0.9rem;text-align:center;}
.today .tl{font-size:0.78rem;color:var(--muted2);font-weight:700;}
.today .tv{font-size:1.15rem;font-weight:800;margin:0.35rem 0 0.7rem;line-height:1.45;}
.tgo{width:100%;min-height:56px;border:none;border-radius:13px;background:var(--grad-g);
  color:#2a1c07;font-size:1.05rem;font-weight:800;cursor:pointer;}
.tgo:active{transform:scale(0.97);}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;margin-bottom:0.6rem;}
.mini .m{background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:0.6rem 0.4rem;text-align:center;}
.mini .m b{display:block;font-size:1.5rem;font-weight:800;line-height:1;}
.mini .m span{display:block;font-size:0.72rem;color:var(--muted);margin-top:0.25rem;font-weight:700;}
.mini .m i{display:block;font-size:0.62rem;color:var(--muted2);font-style:normal;margin-top:1px;}
.mini .mas b{color:var(--success);} .mini .lrn b{color:var(--accent);}
.mini .unt b{color:var(--muted2);} .mini .due b{color:var(--warn);}
.mini .wr b{color:var(--danger);} .mini .tod b{color:var(--accent2);}
.bar{height:12px;background:var(--surface);border-radius:7px;overflow:hidden;margin:0.5rem 0 0.2rem;position:relative;}
.bar i{display:block;height:100%;background:var(--accent);opacity:.45;}
.bar u{position:absolute;left:0;top:0;height:100%;background:var(--success);border-radius:7px;}
.barlab{display:flex;justify-content:space-between;font-size:0.72rem;color:var(--muted2);margin-bottom:1rem;}

h2{font-size:0.95rem;margin:1.1rem 0 0.5rem;color:var(--muted);font-weight:700;}
h2 .sub{font-size:0.7rem;color:var(--muted2);font-weight:600;margin-left:0.3rem;}
.rowsel{display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.6rem;}
.chip{background:var(--surface);border:1.5px solid var(--border);border-radius:999px;
  padding:0.45rem 0.9rem;font-size:0.85rem;cursor:pointer;color:var(--muted);}
.chip.on{background:var(--grad);color:#fff;border-color:transparent;font-weight:700;}
.chip.g.on{background:var(--grad-g);color:#2a1c07;}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0.6rem;}
.mode{background:var(--bg2);border:1.5px solid var(--border);border-radius:14px;padding:1rem;
  cursor:pointer;text-align:left;color:var(--text);transition:all .15s;font:inherit;}
.mode:active{transform:scale(0.97);}
.mode:hover{border-color:var(--accent);}
.mode .ic{font-size:1.5rem;line-height:1;}
.mode .t{font-weight:800;margin-top:0.35rem;font-size:1rem;}
.mode .d{font-size:0.76rem;color:var(--muted2);margin-top:0.2rem;line-height:1.45;}

/* 학습 */
#study,#browse{display:none;}
.prog{display:flex;align-items:center;gap:0.5rem;font-size:0.8rem;color:var(--muted2);
  margin-bottom:0.7rem;flex-wrap:wrap;}
.prog .pb{flex:1;min-width:80px;height:6px;background:var(--surface);border-radius:4px;overflow:hidden;}
.prog .pb i{display:block;height:100%;background:var(--grad-g);transition:width .25s;}

.qcard{background:var(--bg2);border:1.5px solid var(--border);border-radius:18px;
  padding:1.4rem 0.9rem;text-align:center;}
.cy{font-family:var(--font-cn);font-weight:800;line-height:1.15;letter-spacing:0.06em;
  font-size:calc(clamp(2.6rem,15vw,4.6rem)*var(--hz));}
.cy .bk{color:var(--warn);}
.cy .hit{color:var(--gold);}
.py{font-size:1rem;color:var(--accent2);margin-top:0.5rem;letter-spacing:0.02em;}
.qask{font-size:0.8rem;color:var(--muted2);font-weight:700;margin-bottom:0.5rem;}
.qmean{font-size:1.35rem;font-weight:800;line-height:1.5;padding:0.6rem 0.2rem;}

.opts{display:grid;gap:0.5rem;margin-top:0.9rem;}
.opt{background:var(--bg2);border:1.5px solid var(--border);border-radius:13px;
  padding:0.85rem 0.9rem;font-size:1rem;cursor:pointer;color:var(--text);text-align:left;
  font:inherit;line-height:1.45;transition:all .12s;}
.opt:hover{border-color:var(--accent);}
.opt.cn{font-family:var(--font-cn);font-size:1.7rem;font-weight:700;text-align:center;letter-spacing:0.05em;}
.opt.ch{font-family:var(--font-cn);font-size:2.4rem;font-weight:800;text-align:center;padding:0.6rem;}
.opt.ok{border-color:var(--success);background:rgba(52,211,153,0.14);}
.opt.ng{border-color:var(--danger);background:rgba(240,82,82,0.13);}
.opt:disabled{cursor:default;}
.optgrid{grid-template-columns:1fr 1fr;}

.fb{min-height:1.6rem;text-align:center;font-weight:800;margin-top:0.7rem;}
.fb.ok{color:var(--success);} .fb.ng{color:var(--danger);}

.expl{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:0.9rem 1rem;margin-top:0.8rem;text-align:left;font-size:0.9rem;line-height:1.65;}
.expl .r{display:flex;gap:0.5rem;margin-bottom:0.35rem;}
.expl .r:last-child{margin-bottom:0;}
.expl .k{flex:0 0 4.2rem;color:var(--muted2);font-size:0.78rem;font-weight:700;padding-top:0.15rem;}
.expl .v{flex:1;}
.expl .v.ko{color:var(--gold);font-weight:700;}
.expl .v.st{color:var(--muted);font-size:0.86rem;}
.acts{display:flex;gap:0.5rem;margin-top:0.9rem;flex-wrap:wrap;}
.act{flex:1;min-width:120px;min-height:52px;border:none;border-radius:13px;font-size:1rem;
  font-weight:800;cursor:pointer;color:#fff;background:var(--accent);font-family:inherit;}
.act.no{background:var(--danger);} .act.yes{background:var(--success);}
.act.sec{background:var(--surface2);color:var(--muted);}
.done{text-align:center;padding:2rem 0.5rem;}
.done .big{font-size:3rem;}

/* 카드 모드 */
.swipe{display:flex;gap:0.5rem;margin-top:0.8rem;}
.swipe button{flex:1;min-height:52px;border-radius:13px;border:1.5px solid var(--border);
  background:var(--bg2);color:var(--text);font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;}
.swipe button.mid{flex:1.4;background:var(--grad-g);color:#2a1c07;border:none;}

/* 목록 */
.inp{background:var(--surface);border:1.5px solid var(--border);border-radius:11px;
  color:var(--text);padding:0.6rem 0.8rem;font-size:1rem;font-family:inherit;}
.li{background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:0.75rem 0.9rem;
  margin-bottom:0.5rem;cursor:pointer;display:flex;gap:0.7rem;align-items:center;}
.li:hover{border-color:var(--accent);}
.li .c{font-family:var(--font-cn);font-size:1.6rem;font-weight:800;letter-spacing:0.04em;white-space:nowrap;}
.li .x{flex:1;min-width:0;}
.li .x .p{font-size:0.78rem;color:var(--accent2);}
.li .x .m{font-size:0.9rem;margin-top:0.1rem;}
.li .x .k{font-size:0.74rem;color:var(--gold);margin-top:0.1rem;}
.li .badge{font-size:0.65rem;color:var(--muted2);border:1px solid var(--border);
  border-radius:6px;padding:0.1rem 0.3rem;white-space:nowrap;}

/* 상세 */
.ov{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:100;display:none;
  align-items:flex-end;justify-content:center;}
.ov.on{display:flex;}
.sheet{background:var(--bg2);border-radius:18px 18px 0 0;width:100%;max-width:820px;
  max-height:88vh;overflow:auto;padding:1.1rem 1rem calc(1.6rem + env(safe-area-inset-bottom));}
.sheet .x{float:right;background:var(--surface);border:1px solid var(--border);color:var(--muted);
  border-radius:9px;padding:0.3rem 0.6rem;cursor:pointer;}
.rel{display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.4rem;}
.rel button{background:var(--surface);border:1px solid var(--border);border-radius:9px;
  color:var(--text);padding:0.35rem 0.6rem;cursor:pointer;font-family:var(--font-cn);font-size:0.95rem;}
.hint{font-size:0.78rem;color:var(--muted2);line-height:1.6;}
.mid{text-align:center;color:var(--muted2);padding:1.4rem 0;font-size:0.9rem;}
</style>
</head>
<body>

<div class="top">
  <button class="tbtn" onclick="location.href='/words'">← 단어</button>
  <h1><em>成语</em>4자성어</h1>
  <button class="tbtn" onclick="location.href='/dapei'" title="짝꿍단어(호응) 학습"
    style="font-family:var(--font-cn);color:#4fd1c5;font-weight:800;">搭配</button>
  <button class="tbtn" onclick="openBrowse()" id="btnList">목록</button>
  <button class="tbtn" onclick="hz(-1)">가−</button>
  <button class="tbtn" onclick="hz(1)">가+</button>
  <button class="tbtn" onclick="toggleTheme()">🌙</button>
</div>

<div class="wrap">

<!-- 홈 -->
<div id="home">
  <div class="today">
    <div class="tl">오늘의 성어 학습</div>
    <div class="tv" id="todo">불러오는 중…</div>
    <button class="tgo" onclick="start(recommendMode())" id="tgoBtn">시작하기</button>
  </div>

  <div class="bar"><i id="barSeen" style="width:0"></i><u id="barMas" style="width:0"></u></div>
  <div class="barlab"><span id="labL">—</span><span id="labR">—</span></div>

  <div class="mini">
    <div class="m mas"><b id="sMas">0</b><span>숙달<i>5회 연속 정답</i></span></div>
    <div class="m lrn"><b id="sLrn">0</b><span>외우는 중<i>학습 시작함</i></span></div>
    <div class="m unt"><b id="sUnt">0</b><span>안 배움<i>처음 보는 성어</i></span></div>
  </div>
  <div class="mini">
    <div class="m due"><b id="sDue">0</b><span>복습 대기<i>오늘 볼 것</i></span></div>
    <div class="m wr"><b id="sWrong">0</b><span>틀린 성어<i>오답 복습</i></span></div>
    <div class="m tod"><b id="sToday">0</b><span>오늘 푼 문제<i>정답률</i></span></div>
  </div>

  <h2>범위 <span class="sub">고를수록 좁아집니다</span></h2>
  <div class="rowsel" id="filtSel"></div>

  <h2>학습 방식</h2>
  <div class="modes">
    <button class="mode" onclick="start('card')" style="border-color:var(--gold);">
      <div class="ic">📖</div><div class="t">성어 카드</div>
      <div class="d">문제 없이 <b>뜻·직역·유래</b>까지 한 장씩 넘겨보기 (진도 기록 안 함)</div></button>
    <button class="mode" onclick="start('meaning')">
      <div class="ic">🎯</div><div class="t">뜻 맞히기</div>
      <div class="d">성어를 보고 뜻 고르기. 가장 기본</div></button>
    <button class="mode" onclick="start('idiom')">
      <div class="ic">🀄</div><div class="t">성어 고르기</div>
      <div class="d">뜻을 보고 성어 고르기. 쓰기·작문에 도움</div></button>
    <button class="mode" onclick="start('blank')" style="border-color:var(--warn);">
      <div class="ic">⬜</div><div class="t">빈칸 채우기</div>
      <div class="d">네 글자 중 <b>한 글자</b>를 채웁니다. 시험 빈출 유형</div></button>
    <button class="mode" onclick="start('listen')" style="border-color:var(--accent2);">
      <div class="ic">🔊</div><div class="t">듣고 고르기</div>
      <div class="d">음성을 듣고 성어 고르기</div></button>
    <button class="mode" onclick="startStory()" style="border-color:var(--success);">
      <div class="ic">📜</div><div class="t">고사성어 이야기</div>
      <div class="d">유래가 있는 성어만 모아서 카드로 봅니다</div></button>
  </div>

  <h2>도움말</h2>
  <div class="hint">
    성어 진도는 단어 학습과 같은 복습 일정(라이트너 박스)을 씁니다 —
    맞히면 다음 복습이 미뤄지고, 틀리면 금방 다시 나옵니다.<br>
    음성이 아직 없는 성어는 브라우저 읽어주기로 대신 들려줍니다.
  </div>
  <div class="rowsel" style="margin-top:0.6rem;align-items:center;">
    <button class="tbtn" onclick="ttsBatch()" id="btnTts">🎙️ 성어 음성 만들기</button>
    <span class="hint" id="ttsMsg">내 목소리(XTTS)로 성어 음성을 채웁니다 · GPU를 오래 씁니다</span>
  </div>
</div>

<!-- 학습 -->
<div id="study">
  <div class="prog">
    <span id="pgTxt">0 / 0</span><div class="pb"><i id="pgBar" style="width:0"></i></div>
    <button class="tbtn" onclick="toggleStar()" id="btnStar" title="별표">☆</button>
    <button class="tbtn" onclick="goHome()">✕</button>
  </div>
  <div id="stage"></div>
  <div class="fb" id="fb"></div>
</div>

<!-- 목록 -->
<div id="browse">
  <div class="rowsel">
    <input class="inp" id="bq" placeholder="성어 · 병음(shou zhu) · 뜻 · 한국 사자성어"
           style="flex:1;min-width:180px;" autocomplete="off"
           oninput="qLive()" onkeydown="if(event.key==='Enter')loadList(0)">
    <button class="tbtn" onclick="loadList(0)">검색</button>
    <button class="tbtn" onclick="document.getElementById('bq').value='';loadList(0)">지우기</button>
    <button class="tbtn" onclick="goHome()">✕</button>
  </div>
  <div class="rowsel" id="bfilt"></div>
  <div class="mid" id="bmsg"></div>
  <div id="blist"></div>
  <div class="rowsel" style="justify-content:center;margin-top:0.7rem;">
    <button class="tbtn" onclick="pageList(-1)">‹ 이전</button>
    <span id="bpg" style="align-self:center;font-size:0.85rem;color:var(--muted2)"></span>
    <button class="tbtn" onclick="pageList(1)">다음 ›</button>
  </div>
</div>

</div><!-- /wrap -->

<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<script>
const API='';
let TOKEN=localStorage.getItem('token')||'';
function H(){ return TOKEN?{'Authorization':'Bearer '+TOKEN}:{}; }
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
async function api(path, opt){
  const r=await fetch(API+path, Object.assign({headers:Object.assign({'Content-Type':'application/json'},H())}, opt||{}));
  if(r.status===401){ location.href='/login'; return null; }
  return r.ok ? r.json() : null;
}

let HZ=parseFloat(localStorage.getItem('cn_hz')||'1');
function applyHz(){ document.documentElement.style.setProperty('--hz', HZ.toFixed(2)); }
function hz(d){ HZ=Math.max(0.7,Math.min(2.0,+(HZ+d*0.15).toFixed(2)));
  localStorage.setItem('cn_hz',HZ); applyHz(); }
applyHz();
if(localStorage.getItem('cn_theme')==='light') document.body.classList.add('light');
function toggleTheme(){ document.body.classList.toggle('light');
  localStorage.setItem('cn_theme', document.body.classList.contains('light')?'light':'dark'); }

const home=document.getElementById('home'), study=document.getElementById('study'),
      browse=document.getElementById('browse'), stage=document.getElementById('stage'),
      fb=document.getElementById('fb'), pgTxt=document.getElementById('pgTxt'),
      pgBar=document.getElementById('pgBar');

// 범위 필터 — 서버 쿼리 파라미터로 그대로 넘어간다
const FILTS=[
  {k:'',        n:'전체'},
  {k:'hsk7',    n:'HSK 7~9급'},
  {k:'story',   n:'유래 있는 것'},
  {k:'new',     n:'안 배운 것'},
  {k:'learning',n:'외우는 중'},
  {k:'due',     n:'복습 대기'},
  {k:'wrong',   n:'틀린 것'},
  {k:'star',    n:'★ 별표'},
];
let FILT=localStorage.getItem('cy_filt')||'';
function qs(){
  const p=[];
  if(FILT==='hsk7') p.push('hsk=7');
  else if(FILT==='story') p.push('has_story=1');
  else if(FILT) p.push('only='+FILT);
  return p.join('&');
}
function paintFilt(){
  const html=FILTS.map(f=>`<button class="chip g${FILT===f.k?' on':''}" onclick="setFilt('${f.k}')">${f.n}</button>`).join('');
  document.getElementById('filtSel').innerHTML=html;
  document.getElementById('bfilt').innerHTML=html;
}
function setFilt(k){ FILT=k; localStorage.setItem('cy_filt',k); paintFilt();
  loadStats(); if(browse.style.display==='block') loadList(0); }

// ── 홈 ──
let ST={};
async function loadStats(){
  const d=await api('/api/chengyu/stats'); if(!d) return;
  ST=d;
  const g=id=>document.getElementById(id);
  g('sMas').textContent=d.mastered; g('sLrn').textContent=d.learning;
  g('sUnt').textContent=d.untouched; g('sDue').textContent=d.due;
  g('sWrong').textContent=d.wrong;
  g('sToday').textContent=d.today_count+(d.today_count?` · ${Math.round(100*d.today_correct/d.today_count)}%`:'');
  const pct=t=>d.total?(100*t/d.total).toFixed(1):0;
  g('barSeen').style.width=pct(d.seen)+'%';
  g('barMas').style.width=pct(d.mastered)+'%';
  g('labL').textContent=`학습 ${d.seen} / ${d.total}개 (${pct(d.seen)}%)`;
  g('labR').textContent=`숙달 ${d.mastered}개 · 유래 ${d.story}편`;
  let todo=[];
  if(d.due) todo.push(`복습 ${d.due}개`);
  if(d.wrong) todo.push(`오답 ${d.wrong}개`);
  if(!todo.length) todo.push(d.untouched?`새 성어 ${Math.min(12,d.untouched)}개`:'전부 한 번씩 봤습니다');
  g('todo').textContent=todo.join(' · ');
  g('tgoBtn').textContent = d.due ? '복습부터 하기' : (d.wrong ? '틀린 것부터' : '새 성어 배우기');
}
function recommendMode(){
  if(ST.due){ FILT='due'; } else if(ST.wrong){ FILT='wrong'; } else if(ST.untouched){ FILT='new'; }
  localStorage.setItem('cy_filt',FILT); paintFilt();
  return 'meaning';   // 진도가 쌓이는 방식으로 시작 (카드는 넘겨보기라 기록되지 않는다)
}
function goHome(){ stopSpeak(); home.style.display='block'; study.style.display='none';
  browse.style.display='none'; loadStats(); }

// ── 발음 ──
let AU=null;
function stopSpeak(){ try{ if(AU) AU.pause(); }catch(e){} try{ speechSynthesis.cancel(); }catch(e){} }
function speak(w, v){
  stopSpeak();
  const p = (v===2 ? w.audio2 : w.audio1) || w.audio1 || w.audio2;
  if(p){ try{ AU=new Audio('/'+String(p).replace(/^\/+/,'')); AU.play().catch(()=>fallback(w)); return; }catch(e){} }
  fallback(w);
}
function fallback(w){    // 아직 음성을 만들지 않은 성어는 브라우저 읽어주기로
  try{
    const u=new SpeechSynthesisUtterance(w.chinese);
    u.lang='zh-CN'; u.rate=0.75; speechSynthesis.speak(u);
  }catch(e){}
}

// ── 세션 ──
let MODE='', LIST=[], IDX=0, T0=0, SESSOK=0, SHOWN=false;
async function start(mode, extra){
  MODE=mode;
  const n = (mode==='card') ? 20 : 12;
  const d=await api(`/api/chengyu/session?mode=${mode}&limit=${n}&${qs()}${extra||''}`);
  if(!d || !d.items.length){
    alert(FILT ? '이 범위에 낼 성어가 없습니다. 범위를 넓혀보세요.'
               : (mode==='listen' ? '아직 음성이 만들어진 성어가 없습니다.' : '학습할 성어가 없습니다'));
    return;
  }
  LIST=d.items; IDX=0; SESSOK=0; stopSpeak();
  home.style.display='none'; browse.style.display='none'; study.style.display='block';
  render();
}
function startStory(){ FILT='story'; localStorage.setItem('cy_filt','story'); paintFilt(); start('card'); }

function prog(){
  pgTxt.textContent=`${IDX+1} / ${LIST.length}`;
  pgBar.style.width=(100*IDX/LIST.length)+'%';
  const w=LIST[IDX];
  document.getElementById('btnStar').textContent = (w && w.starred) ? '★' : '☆';
}
function next(){ IDX++; if(IDX>=LIST.length){ finish(); return; }
  fb.textContent=''; fb.className='fb'; render(); }
function finish(){
  stopSpeak();
  stage.innerHTML=`<div class="done"><div class="big">🎉</div>
    <h3>${LIST.length}개 완료!</h3>
    <div style="color:var(--accent2);font-weight:800;margin-bottom:1rem;">${
      MODE==='card' ? '넘겨보기는 진도에 반영되지 않습니다' : `새로 학습 +${SESSOK}개`}</div>
    <div class="acts">
      <button class="act yes" onclick="start('${MODE}')">이어서 하기</button>
      <button class="act no" onclick="FILT='wrong';localStorage.setItem('cy_filt','wrong');paintFilt();start('meaning')">틀린 것만</button>
      <button class="act sec" onclick="goHome()">홈으로</button></div></div>`;
  fb.textContent=''; pgBar.style.width='100%'; pgTxt.textContent=`${LIST.length} / ${LIST.length}`;
  loadStats();
}
async function record(ok){
  const w=LIST[IDX];
  if(!w.seen){ SESSOK++; w.seen=1; }
  await api('/api/words/answer',{method:'POST',body:JSON.stringify(
    {word_id:w.id, mode:'cy_'+MODE, result:ok?1:0, ms:Date.now()-T0})});
}
async function toggleStar(){
  const w=LIST[IDX]; if(!w) return;
  const on=w.starred?0:1;
  const r=await api('/api/words/star',{method:'POST',body:JSON.stringify({word_id:w.id,on})});
  if(r){ w.starred=on; document.getElementById('btnStar').textContent=on?'★':'☆'; }
}

// 해설 — 직역 / 대응 한국 사자성어 / 유래
function explHtml(w, opts){
  const o=opts||{};
  let h='<div class="expl">';
  if(o.mean!==false) h+=`<div class="r"><div class="k">뜻</div><div class="v"><b>${esc(w.meaning_ko)}</b></div></div>`;
  if(w.literal_ko) h+=`<div class="r"><div class="k">직역</div><div class="v">${esc(w.literal_ko)}</div></div>`;
  if(w.ko_idiom)  h+=`<div class="r"><div class="k">한국</div><div class="v ko">${esc(w.ko_idiom)}</div></div>`;
  if(w.story)     h+=`<div class="r"><div class="k">유래</div><div class="v st">${esc(w.story)}</div></div>`;
  if(w.meaning_en)h+=`<div class="r"><div class="k">영어</div><div class="v st">${esc(w.meaning_en)}</div></div>`;
  return h+'</div>';
}

function render(){
  prog(); T0=Date.now(); SHOWN=false;
  const w=LIST[IDX];
  if(MODE==='card')      return renderCard(w);
  if(MODE==='meaning')   return renderChoice(w,'meaning');
  if(MODE==='listen')    return renderChoice(w,'listen');
  if(MODE==='idiom')     return renderChoice(w,'idiom');
  if(MODE==='blank')     return renderBlank(w);
}

// 카드 — 성어 → (탭) → 뜻·직역·유래
function renderCard(w){
  stage.innerHTML=`
    <div class="qcard" onclick="cardFlip()">
      <div class="cy">${esc(w.chinese)}</div>
      <div class="py">${esc(w.pinyin)}</div>
      <div id="cbody" style="margin-top:0.8rem;color:var(--muted2);font-size:0.85rem;">눌러서 뜻 보기</div>
    </div>
    <div class="swipe">
      <button onclick="cardPrev()">‹ 이전</button>
      <button class="mid" onclick="speak(LIST[IDX])">🔊 발음</button>
      <button onclick="cardNext()">다음 ›</button>
    </div>`;
  if(localStorage.getItem('cy_auto')==='1') cardFlip();
}
function cardFlip(){
  // 넘겨보기는 문제를 푼 것이 아니므로 진도(라이트너 박스)에 넣지 않는다 — /flash 와 같은 규칙
  const w=LIST[IDX], b=document.getElementById('cbody'); if(!b) return;
  if(SHOWN) return; SHOWN=true;
  b.innerHTML=explHtml(w);
}
function cardPrev(){ if(IDX>0){ IDX--; fb.textContent=''; render(); } }
function cardNext(){ if(!SHOWN) cardFlip(); next(); }

// 4지선다 — meaning: 성어→뜻 / idiom: 뜻→성어 / listen: 음성→성어
function renderChoice(w, kind){
  const head = kind==='meaning'
    ? `<div class="qask">이 성어의 뜻은?</div>
       <div class="cy">${esc(w.chinese)}</div><div class="py">${esc(w.pinyin)}</div>`
    : kind==='idiom'
    ? `<div class="qask">이 뜻에 맞는 성어는?</div><div class="qmean">${esc(w.meaning_ko)}</div>`
    : `<div class="qask">듣고 성어를 고르세요</div>
       <div style="font-size:3.4rem;cursor:pointer;" onclick="speak(LIST[IDX])">🔊</div>
       <div style="font-size:0.78rem;color:var(--muted2);">눌러서 다시 듣기</div>`;
  const opts=w.choices.map((o,i)=>
    kind==='meaning'
      ? `<button class="opt" onclick="pick(${i},this)">${esc(o.meaning_ko)}</button>`
      : `<button class="opt cn" onclick="pick(${i},this)">${esc(o.chinese)}</button>`).join('');
  stage.innerHTML=`<div class="qcard">${head}</div><div class="opts">${opts}</div>`;
  if(kind==='listen') setTimeout(()=>speak(w), 250);
}
function pick(i, el){
  if(SHOWN) return; SHOWN=true;
  const w=LIST[IDX], ok=!!w.choices[i].ok;
  document.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled=true;
    if(w.choices[j].ok) b.classList.add('ok');
    else if(j===i) b.classList.add('ng');
  });
  reveal(ok);
}

// 빈칸 채우기 — 네 글자 중 한 글자
function renderBlank(w){
  const cn=w.chinese, at=w.blank_at;
  const shown=[...cn].map((ch,i)=>i===at?`<span class="bk">＿</span>`:esc(ch)).join('');
  stage.innerHTML=`
    <div class="qcard">
      <div class="qask">빈칸에 들어갈 글자는?</div>
      <div class="cy">${shown}</div>
      <div class="py">${esc(w.pinyin)}</div>
      <div style="margin-top:0.6rem;font-size:1rem;font-weight:700;">${esc(w.meaning_ko)}</div>
    </div>
    <div class="opts optgrid">${w.blank_choices.map((ch,i)=>
      `<button class="opt ch" onclick="pickBlank(${i},this)">${esc(ch)}</button>`).join('')}</div>`;
}
function pickBlank(i){
  if(SHOWN) return; SHOWN=true;
  const w=LIST[IDX], ok=w.blank_choices[i]===w.blank_answer;
  document.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled=true;
    if(w.blank_choices[j]===w.blank_answer) b.classList.add('ok');
    else if(j===i) b.classList.add('ng');
  });
  const cy=document.querySelector('.cy');
  if(cy) cy.innerHTML=[...w.chinese].map((ch,k)=>k===w.blank_at?`<span class="hit">${esc(ch)}</span>`:esc(ch)).join('');
  reveal(ok);
}

function reveal(ok){
  const w=LIST[IDX];
  fb.textContent = ok ? '정답!' : '오답';
  fb.className='fb '+(ok?'ok':'ng');
  record(ok);
  speak(w);
  stage.insertAdjacentHTML('beforeend', explHtml(w, {mean:MODE==='meaning'?false:true}) +
    `<div class="acts"><button class="act${ok?' yes':''}" onclick="next()">다음 →</button></div>`);
}

// ── 목록 ──
let BOFF=0, BTOTAL=0, QT=null;
function openBrowse(){ home.style.display='none'; study.style.display='none';
  browse.style.display='block'; paintFilt(); loadList(0); }
function qLive(){ clearTimeout(QT); QT=setTimeout(()=>loadList(0), 350); }
function pageList(d){ const n=BOFF+d*60; if(n<0||n>=BTOTAL) return; loadList(n); }
async function loadList(off){
  BOFF=off;
  const q=encodeURIComponent((document.getElementById('bq').value||'').trim());
  document.getElementById('bmsg').textContent='불러오는 중…';
  const d=await api(`/api/chengyu/list?q=${q}&offset=${off}&limit=60&${qs()}`);
  if(!d){ document.getElementById('bmsg').textContent='불러오지 못했습니다'; return; }
  BTOTAL=d.total;
  document.getElementById('bmsg').textContent = d.total ? `${d.total}개` : '결과가 없습니다';
  document.getElementById('bpg').textContent = d.total ? `${off+1}–${Math.min(off+60,d.total)} / ${d.total}` : '';
  document.getElementById('blist').innerHTML=d.items.map(w=>`
    <div class="li" onclick="openSheet(${w.id})">
      <div class="c">${esc(w.chinese)}</div>
      <div class="x">
        <div class="p">${esc(w.pinyin)}</div>
        <div class="m">${esc(w.meaning_ko)}</div>
        ${w.ko_idiom?`<div class="k">${esc(w.ko_idiom)}</div>`:''}
      </div>
      ${w.story?'<div class="badge">유래</div>':''}
      ${w.box>=5?'<div class="badge">숙달</div>':''}
    </div>`).join('');
  window.scrollTo(0,0);
}

// ── 상세 ──
async function openSheet(id){
  const d=await api('/api/chengyu/detail/'+id); if(!d) return;
  document.getElementById('sheet').innerHTML=`
    <button class="x" onclick="closeSheet()">닫기</button>
    <div style="font-family:var(--font-cn);font-size:2.6rem;font-weight:800;letter-spacing:0.05em;">${esc(d.chinese)}</div>
    <div class="py" style="margin-bottom:0.6rem;">${esc(d.pinyin)}
      <button class="tbtn" style="margin-left:0.4rem;" onclick='speak(${JSON.stringify({chinese:d.chinese,audio1:d.audio1,audio2:d.audio2})})'>🔊</button></div>
    ${explHtml(d)}
    ${d.related && d.related.length ? `<h2>같은 글자를 쓰는 성어</h2>
      <div class="rel">${d.related.map(r=>
        `<button onclick="openSheet(${r.id})">${esc(r.chinese)}</button>`).join('')}</div>` : ''}
    <div class="acts">
      <button class="act sec" onclick="closeSheet()">닫기</button>
    </div>`;
  document.getElementById('ov').classList.add('on');
}
function closeSheet(){ stopSpeak(); document.getElementById('ov').classList.remove('on'); }

document.addEventListener('keydown', e=>{
  if(study.style.display!=='block') return;
  if(e.key==='Enter' && SHOWN) next();
  if(e.key===' '){ e.preventDefault(); if(MODE==='card') cardFlip(); else speak(LIST[IDX]); }
  if(/^[1-4]$/.test(e.key)){
    const b=document.querySelectorAll('.opt')[+e.key-1]; if(b && !b.disabled) b.click();
  }
});

// ── 성어 음성 배치 (XTTS · GPU) ──
let TTSPOLL=null;
async function ttsBatch(){
  if(!confirm('음성이 없는 성어에 XTTS 음성을 만듭니다.\nGPU를 오래 쓰기 때문에 다른 GPU 작업과 겹치면 느려집니다.\n시작할까요?')) return;
  const r=await api('/api/chengyu/tts-batch',{method:'POST',body:'{}'});
  if(!r){ document.getElementById('ttsMsg').textContent='시작하지 못했습니다'; return; }
  pollTts();
}
async function pollTts(quiet){
  clearInterval(TTSPOLL);
  let sawRunning=false;
  const tick=async()=>{
    const s=await api('/api/chengyu/tts-status'); if(!s) return;
    const p=s.progress||{}, msg=document.getElementById('ttsMsg');
    if(s.running){
      sawRunning=true;
      msg.textContent=`생성 중 — ${p.voice||''} ${p.done||0}/${p.total||0}`;
      document.getElementById('btnTts').disabled=true;
    }else{
      // 페이지를 열자마자 확인한 것이라면(돌고 있지 않음) 안내문을 그대로 둔다
      if(sawRunning || !quiet) msg.textContent='완료 · 새로고침하면 성어 음성이 나옵니다';
      document.getElementById('btnTts').disabled=false;
      clearInterval(TTSPOLL);
    }
  };
  await tick(); if(!document.getElementById('btnTts').disabled && quiet) return;
  TTSPOLL=setInterval(tick, 4000);
}

paintFilt();
loadStats();
pollTts(true);   // 이미 돌고 있으면 진행률을 이어서 보여준다
</script>
</body>
</html>
