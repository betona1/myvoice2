<script>
let cur=null;
function play(f){
  document.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
  event.target.classList.add('on');
  if(cur) cur.pause();
  cur=new Audio('/outputs/chinese/_speed/'+encodeURIComponent(f));
  cur.play();
}
</script>
